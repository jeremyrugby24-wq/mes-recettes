function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function num(v){return Number(v)||0}
function fmt(v){return Number.isInteger(v)?String(v):Number(v).toFixed(1).replace(/\.0$/,"")}
function timeOf(r){
 const t=r.total_time_min??r.total_time??r.time_min;
 if(t!=null) return num(t);
 const a=r.prep_minutes??r.prep_time_min??r.preparation_time_min??0,b=r.cook_minutes??r.cook_time_min??r.cooking_time_min??0;
 return (num(a)+num(b))||null;
}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove("show"),1800)}
function loadCart(){try{return JSON.parse(localStorage.getItem("mes-recettes-cart")||"{}")}catch{return {}}}
function saveCart(){localStorage.setItem("mes-recettes-cart",JSON.stringify(cart));updateCartCount();renderCart()}
function updateCartCount(){document.getElementById("cc").textContent=Object.values(cart).reduce((a,b)=>a+num(b),0)}
function nutrition(n,s){return '<div class="stats"><span class="stat">🔥 <b>'+Math.round(num(n.kcal)*s)+' kcal</b></span><span class="stat">💪 <b>'+fmt(num(n.protein_g)*s)+' g</b> protéines</span><span class="stat">🍚 '+fmt(num(n.carbs_g)*s)+' g glucides</span><span class="stat">🥑 '+fmt(num(n.fat_g)*s)+' g lipides</span></div>'}

function render(){
 const q=document.getElementById("q").value.trim().toLowerCase(),f=document.getElementById("f").value;
 const a=R.filter(r=>{
  const hay=(r.title+" "+(r.description||"")+" "+(r.tags||"")+" "+(r.ingredients||[]).map(i=>i.ingredient).join(" ")).toLowerCase();
  return (!q||hay.includes(q))&&(f==="all"||(f==="p"&&num(r.nutrition_per_serving?.protein_g)>=40)||(f==="k"&&num(r.nutrition_per_serving?.kcal)<=500));
 });
 document.getElementById("count").textContent=a.length+" recette"+(a.length>1?"s":"");
 document.getElementById("grid").innerHTML=a.length?a.map(r=>{
  const n=r.nutrition_per_serving||{},t=timeOf(r);
  return '<article class="card"><img loading="lazy" src="'+esc(r.image_url||"")+'" alt=""><div class="cardBody"><h2>'+esc(r.title)+'</h2><p class="desc">'+esc(r.description||"")+'</p><div class="meta"><span class="pill">🔥 '+Math.round(num(n.kcal))+' kcal</span><span class="pill">💪 '+fmt(num(n.protein_g))+' g prot.</span>'+(t?'<span class="pill">⏱️ '+fmt(t)+' min</span>':"")+'</div><button class="btn" data-open="'+esc(r.id)+'">Voir la recette</button></div></article>'
 }).join(""):'<div class="loading">Aucune recette trouvée.</div>';
 updateCartCount();
}

function openRecipe(id){
 const r=R.find(x=>x.id===id);if(!r)return;
 currentRecipe=r;currentPortions=1;drawModal();document.getElementById("overlay").classList.add("open");document.getElementById("overlay").setAttribute("aria-hidden","false");document.body.style.overflow="hidden";
}
function closeModal(){document.getElementById("overlay").classList.remove("open");document.getElementById("overlay").setAttribute("aria-hidden","true");document.body.style.overflow="";currentRecipe=null}
function drawModal(){
 const r=currentRecipe,n=r.nutrition_per_serving||{},t=timeOf(r);
 const ing=(r.ingredients||[]).map(i=>'<li><span>'+esc(i.ingredient)+'</span><b>'+fmt(num(i.qty)*currentPortions)+' '+esc(i.unit||"")+'</b></li>').join("");
 const steps=(r.steps||[]).map(x=>'<li>'+esc(x.text||x)+'</li>').join("");
 document.getElementById("overlay").innerHTML='<div class="modalBox" role="dialog" aria-modal="true"><img class="modalHero" src="'+esc(r.image_url||"")+'" alt=""><div class="modalScroll"><div class="modalTop"><div><h2>'+esc(r.title)+'</h2><p class="modalDesc">'+esc(r.description||"")+'</p></div><button class="iconBtn" id="closeModal" aria-label="Fermer">✕</button></div>'+nutrition(n,currentPortions)+(t?'<div class="stat">⏱️ Temps total : <b>'+fmt(t)+' min</b></div>':"")+'<div class="portionBar"><button class="stepBtn" id="minus" aria-label="Diminuer">−</button><div class="portionValue"><span id="portionNumber">'+currentPortions+'</span> portion'+(currentPortions>1?"s":"")+'</div><button class="stepBtn" id="plus" aria-label="Augmenter">+</button></div><h3 class="sectionTitle">Ingrédients</h3><ul class="ings">'+ing+'</ul><h3 class="sectionTitle">Préparation</h3><ol class="steps">'+steps+'</ol><div class="modalActions"><button class="btn" id="addCart">🛒 Ajouter '+currentPortions+' portion'+(currentPortions>1?"s":"")+' au panier</button></div></div></div>';
}
function changePortions(delta){currentPortions=Math.max(1,Math.min(20,currentPortions+delta));drawModal()}
function addToCart(){
 const id=currentRecipe.id;cart[id]=(cart[id]||0)+currentPortions;saveCart();showToast(currentPortions+" portion"+(currentPortions>1?"s":"")+" ajoutée"+(currentPortions>1?"s":"")+" au panier");closeModal();openDrawer();
}

function cartText(){
 const ids=Object.keys(cart).filter(id=>num(cart[id])>0), total={};
 ids.map(id=>R.find(r=>r.id===id)).filter(Boolean).forEach(r=>(r.ingredients||[]).forEach(i=>{const k=i.ingredient+"|"+i.unit;if(!total[k])total[k]={name:i.ingredient,unit:i.unit,qty:0};total[k].qty+=num(i.qty)*num(cart[r.id])}));
 return "LISTE DE COURSES\\n\\n"+Object.values(total).map(i=>"• "+i.name+" : "+fmt(i.qty)+" "+(i.unit||"")).join("\\n");
}
function startActionCooldown(id){const btn=document.getElementById(id);if(!btn||btn.disabled)return false;btn.disabled=true;const original=btn.textContent;let left=10;btn.textContent=original+" (10 s)";const timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);btn.disabled=false;btn.textContent=original}else btn.textContent=original+" ("+left+" s)"},1000);return true}
async function copyCart(){
 if(!startActionCooldown("copyCart"))return;
 const txt=cartText();let copied=false;
 try{await navigator.clipboard.writeText(txt);copied=true}catch{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();copied=document.execCommand("copy");ta.remove()}
 if(copied)showToast("Liste de courses copiée !");else showToast("Impossible de copier la liste");
}
async function addCartRecipesToPlan(){
 const ids=Object.keys(cart).filter(id=>num(cart[id])>0);
 if(!ids.length){showToast("Ton panier est vide");return}
 if(!userSession){showPanel("auth");showToast("Connecte-toi pour enregistrer ton planning");return}
 const existing=ids.filter(id=>plannedRecipes.some(item=>String(item.recipe_id)===String(id)));
 if(existing.length&&!window.confirm(existing.length===1?"Cette recette est déjà dans ton planning. Veux-tu vraiment la remettre au planning ?":"Certaines recettes sont déjà dans ton planning. Veux-tu vraiment les remettre au planning ?"))return;
 const payload=ids.map(id=>({user_id:userSession.user.id,recipe_id:String(id),portions:num(cart[id]),completed_at:null}));
 const {error}=await supabaseClient.from("user_recipes").upsert(payload,{onConflict:"user_id,recipe_id"});
 if(error){console.error(error);showToast("L'ajout des recettes au planning a échoué");return}
 await loadPlan();showToast("Recettes ajoutées au planning !");
}

function printCart(){if(!startActionCooldown("printCart"))return;const w=window.open("","_blank");if(!w){showToast("Autorise les fenêtres pop-up pour imprimer");return}w.document.write("<html><head><title>Liste de courses</title><style>body{font-family:Arial;padding:30px;line-height:1.6}h1{margin-bottom:25px}</style></head><body><h1>🛒 Liste de courses</h1><pre style='white-space:pre-wrap;font:16px Arial'>"+esc(cartText().replace("LISTE DE COURSES\\n\\n",""))+"</pre><script>window.print();<\/script></body></html>");w.document.close()}
function renderCart(){
 const drawer=document.getElementById("drawer"),ids=Object.keys(cart).filter(id=>num(cart[id])>0);
 if(!ids.length){drawer.innerHTML='<div class="drawerHead"><h2>🛒 Liste de courses</h2><button class="iconBtn" id="closeCart">✕</button></div><div class="drawerBody"><div class="empty">Ton panier est vide.<br>Ajoute des recettes pour créer ta liste de courses.</div></div>';return}
 let total={};
 const recipes=ids.map(id=>R.find(r=>r.id===id)).filter(Boolean);
 recipes.forEach(r=>(r.ingredients||[]).forEach(i=>{const k=i.ingredient+"|"+i.unit;if(!total[k])total[k]={name:i.ingredient,unit:i.unit,qty:0};total[k].qty+=num(i.qty)*num(cart[r.id])}));
 drawer.innerHTML='<div class="drawerHead"><h2>🛒 Liste de courses</h2><button class="iconBtn" id="closeCart">✕</button></div><div class="drawerBody"><h3>Recettes sélectionnées</h3>'+recipes.map(r=>'<div class="cartRecipe"><img class="cartRecipeImage" src="'+esc(r.image_url||"")+'" alt="'+esc(r.title)+'" data-open="'+esc(r.id)+'"><div class="cartRecipeMain"><div class="cartRecipeTitle" data-open="'+esc(r.id)+'">'+esc(r.title)+'</div><div class="qtyRow"><button data-cart-minus="'+esc(r.id)+'">−</button><span class="qty">'+cart[r.id]+'</span><button data-cart-plus="'+esc(r.id)+'">+</button><button class="remove" data-cart-remove="'+esc(r.id)+'">Supprimer</button></div></div></div>').join("")+'<div class="shopping"><h3>🛒 Ingrédients à acheter</h3><div class="cartActions"><button class="btn" id="addCartPlan">📅 Ajouter les recettes au planning</button><button class="btn" id="copyCart">📋 Copier</button><button class="btn shareBtn" id="shareCart">↗️ Partager</button><button class="btn shareBtn" id="exportCart">📄 Exporter</button><button class="btn shareBtn" id="printCart">🖨️ Imprimer</button></div><ul class="shoppingList">'+Object.values(total).map(i=>'<li><span>'+esc(i.name)+'</span><b>'+fmt(i.qty)+' '+esc(i.unit||"")+'</b></li>').join("")+'</ul></div></div><div class="drawerFoot"><button class="btn danger" id="clearCart">Vider le panier</button></div>';
}
function openDrawer(){renderCart();document.getElementById("drawer").classList.add("open");document.getElementById("drawerShade").classList.add("open");document.getElementById("drawer").setAttribute("aria-hidden","false");}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");document.getElementById("drawerShade").classList.remove("open");document.getElementById("drawer").setAttribute("aria-hidden","true")}

function showPanel(which){
 const isPlan=which==="plan";
 document.getElementById("authPanel").hidden=which!=="auth";
 document.getElementById("planPanel").hidden=!isPlan;
 document.getElementById("recipeControls").hidden=isPlan;
 document.getElementById("count").hidden=isPlan;
 document.getElementById("grid").hidden=isPlan;
 document.getElementById("openPlan").textContent=isPlan?"🍽️ Recettes":"📅 Mon planning";
 document.body.classList.toggle("planning-mode",isPlan);
 if(which==="auth")renderAuth();
 if(isPlan)renderPlan();
 if(which==="auth"||isPlan)document.getElementById(which==="auth"?"authPanel":"planPanel").scrollIntoView({behavior:"smooth",block:"start"});
}
function updateAccountButton(){
 const btn=document.getElementById("openAuth");if(!btn)return;
 if(!userSession){btn.classList.remove("accountBtn");btn.innerHTML="👤 Connexion";return}
 const meta=userSession.user.user_metadata||{},name=meta.full_name||meta.name||userSession.user.email?.split("@")[0]||"Mon compte",first=name.trim().split(/\s+/)[0],avatar=meta.avatar_url||meta.picture;
 btn.classList.add("accountBtn");
 btn.innerHTML=(avatar?'<img class="accountAvatar" src="'+esc(avatar)+'" alt="">':'<span class="accountInitial">'+esc(first.charAt(0).toUpperCase())+'</span>')+'<span>'+esc(first)+'</span>';
}
function renderAuth(){
 const p=document.getElementById("authPanel");
 if(userSession){
  const meta=userSession.user.user_metadata||{},name=meta.full_name||meta.name||userSession.user.email?.split("@")[0]||"Mon compte",avatar=meta.avatar_url||meta.picture;
  p.innerHTML='<div class="modalTop"><div><h2>👤 Bonjour '+esc(name.trim().split(/\s+/)[0])+' !</h2>'+(avatar?'<img class="accountAvatar" src="'+esc(avatar)+'" alt="" style="width:54px;height:54px;margin:12px 0">':'')+'<p class="modalDesc">Connecté avec <b>'+esc(userSession.user.email||"")+'</b></p></div></div><button class="btn danger" id="signOut">Se déconnecter</button>';
  updateAccountButton();return;
 }
 updateAccountButton();
 p.innerHTML='<div class="authHero"><div class="authMark">🍽️</div><h2>Ravi de te revoir !</h2><p>Connecte-toi pour retrouver ton planning et tes recettes.</p></div><div class="authContent"><form id="authForm" class="authForm"><label for="authEmail">Adresse e-mail<input type="email" id="authEmail" autocomplete="email" placeholder="toi@exemple.fr" required></label><div><label for="authPassword">Mot de passe</label><div class="passwordWrap"><input type="password" id="authPassword" autocomplete="current-password" placeholder="6 caractères minimum" minlength="6" required><button class="passwordToggle" type="button" id="togglePassword" aria-label="Afficher le mot de passe">Afficher</button></div><div class="authLinks"><button type="button" class="textButton" id="forgotPassword">Mot de passe oublié ?</button></div></div><button class="btn authSubmit" type="submit" id="signIn">Se connecter</button><button class="btn secondary authSecondary" type="button" id="signUp">Créer un compte</button></form><div class="authDivider">ou continuer avec</div><button type="button" class="btn googleBtn" id="googleSignIn"><span class="googleG">G</span> Continuer avec Google</button><p id="authMessage" role="status" aria-live="polite"></p><p class="authFoot">Ton compte permet de synchroniser ton planning entre tes appareils.</p></div>';
}
async function refreshSession(){
 const {data}=await supabaseClient.auth.getSession();userSession=data.session;
 supabaseClient.auth.onAuthStateChange((_event,session)=>{userSession=session;renderAuth();if(session)loadPlan();});
}
async function authSubmit(signup){
 const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value,msg=document.getElementById("authMessage");
 msg.textContent="Connexion en cours…";
 const result=signup?await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:"https://jeremyrugby24-wq.github.io/mes-recettes/"}}):await supabaseClient.auth.signInWithPassword({email,password});
 if(result.error){msg.textContent=result.error.message;return}
 if(signup&&!result.data.session){msg.textContent="Compte créé. Vérifie ta boîte mail pour confirmer l'adresse, puis connecte-toi.";return}
 userSession=result.data.session;msg.textContent=signup?"Compte créé !":"Connexion réussie.";renderAuth();await loadPlan();showToast("Connecté !");
}
async function sendPasswordReset(){
 const email=document.getElementById("authEmail")?.value.trim(),msg=document.getElementById("authMessage");
 if(!email){msg.textContent="Saisis d'abord ton adresse e-mail.";document.getElementById("authEmail")?.focus();return}
 msg.textContent="Envoi du lien de réinitialisation…";
 const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:"https://jeremyrugby24-wq.github.io/mes-recettes/"});
 msg.textContent=error?error.message:"Si cette adresse correspond à un compte, un e-mail de réinitialisation va être envoyé.";
}
async function signInWithGoogle(){
 const msg=document.getElementById("authMessage");msg.textContent="Redirection vers Google…";
 const {error}=await supabaseClient.auth.signInWithOAuth({provider:"google",options:{redirectTo:"https://jeremyrugby24-wq.github.io/mes-recettes/"}});
 if(error){msg.textContent=error.message.toLowerCase().includes("provider is not enabled")?"La connexion Google doit d'abord être activée dans les réglages Supabase.":"Connexion Google : "+error.message}
}
async function loadPlan(){
 if(!userSession){plannedRecipes=[];return}
 const {data,error}=await supabaseClient.from("user_recipes").select("*").order("created_at",{ascending:false});
 if(error){showToast("Planning indisponible : vérifie que le script SQL a été exécuté.");console.error(error);return}
 const cutoff=Date.now()-7*24*60*60*1000;
 plannedRecipes=(data||[]).filter(x=>!x.completed_at||new Date(x.completed_at).getTime()>=cutoff);
 renderPlan();
}
function renderPlan(){
 const p=document.getElementById("planPanel");
 if(!userSession){p.innerHTML='<h2>📅 Mon planning</h2><p>Connecte-toi pour créer ton planning personnel.</p><button class="btn" id="planLogin">Se connecter</button>';return}
 const active=plannedRecipes;
 p.innerHTML='<div class="modalTop"><div><h2>📅 Mon planning</h2><p class="modalDesc">Clique sur une recette pour revoir sa fiche. Les recettes réalisées disparaissent ici après 7 jours.</p></div><button class="iconBtn" id="refreshPlan" aria-label="Actualiser">↻</button></div>'+(active.length?active.map(item=>{const r=R.find(x=>String(x.id)===String(item.recipe_id));return '<div class="planRecipeRow '+(item.completed_at?'planDone':'')+'"><input type="checkbox" data-plan-done="'+esc(item.id)+'" '+(item.completed_at?'checked':'')+' aria-label="Recette réalisée">'+(r?'<img class="planRecipeImage" src="'+esc(r.image_url||"")+'" alt="'+esc(r.title)+'" data-open="'+esc(r.id)+'">':'<div class="planRecipeImage"></div>')+'<div class="planRecipeMain"><button class="planRecipeTitleButton" data-open="'+esc(r?.id||"")+'">'+esc(r?.title||"Recette")+'</button><small class="planTitle">'+(item.completed_at?'Réalisée le '+new Date(item.completed_at).toLocaleDateString("fr-FR"):(item.portions||1)+' portion(s) prévue(s)')+'</small></div><button data-plan-remove="'+esc(item.id)+'">Retirer</button></div>'}).join(""):'<p>Ton planning est vide. Ajoute des recettes au panier, puis utilise « Ajouter les recettes au planning ».</p>');
}
async function addCurrentToPlan(){
 if(!userSession){showPanel("auth");showToast("Connecte-toi pour enregistrer ton planning");return}
 const payload={user_id:userSession.user.id,recipe_id:String(currentRecipe.id),portions:currentPortions,completed_at:null};
 const {error}=await supabaseClient.from("user_recipes").upsert(payload,{onConflict:"user_id,recipe_id"});
 if(error){showToast("Erreur planning : vérifie la configuration SQL.");console.error(error);return}
 await loadPlan();showToast("Recette ajoutée au planning");
}
async function markPlanDone(id,done){
 const item=plannedRecipes.find(x=>String(x.id)===String(id));if(!item)return;
 const {error}=await supabaseClient.from("user_recipes").update({completed_at:done?new Date().toISOString():null}).eq("id",id);
 if(error){showToast("Impossible de modifier la recette");return}
 await loadPlan();
}
async function removePlan(id){
 const {error}=await supabaseClient.from("user_recipes").delete().eq("id",id);
 if(error){showToast("Impossible de retirer la recette");return}
 await loadPlan();showToast("Recette retirée");
}
document.addEventListener("click",e=>{
  if(e.target.closest("#openAuth")){showPanel("auth");return}
  if(e.target.closest("#openPlan")){showPanel(document.body.classList.contains("planning-mode")?"recipes":"plan");return}
  if(e.target.closest("#planLogin")){showPanel("auth");return}
  if(e.target.closest("#signUp")){authSubmit(true);return}
   if(e.target.closest("#togglePassword")){const input=document.getElementById("authPassword"),btn=document.getElementById("togglePassword");if(input){const visible=input.type==="password";input.type=visible?"text":"password";btn.textContent=visible?"Masquer":"Afficher";btn.setAttribute("aria-label",visible?"Masquer le mot de passe":"Afficher le mot de passe")}return}
   if(e.target.closest("#forgotPassword")){sendPasswordReset();return}
   if(e.target.closest("#googleSignIn")){signInWithGoogle();return}
  if(e.target.closest("#signOut")){supabaseClient.auth.signOut().then(()=>{userSession=null;plannedRecipes=[];renderAuth();renderPlan();showToast("Déconnecté")});return}
  if(e.target.closest("#refreshPlan")){loadPlan();return}
  if(e.target.closest("#addCartPlan")){addCartRecipesToPlan();return}
  const done=e.target.closest("[data-plan-done]");if(done){markPlanDone(done.dataset.planDone,done.checked);return}
  const rem=e.target.closest("[data-plan-remove]");if(rem){removePlan(rem.dataset.planRemove);return}
 const open=e.target.closest("[data-open]");if(open){if(open.closest("#drawer"))closeDrawer();openRecipe(open.dataset.open);return}
 if(e.target.closest("#closeModal")){closeModal();return}
 if(e.target.closest("#minus")){changePortions(-1);return}
 if(e.target.closest("#plus")){changePortions(1);return}
 if(e.target.closest("#addCart")){addToCart();return}
 if(e.target.closest("#openCart")){openDrawer();return}
 if(e.target.closest("#closeCart")){closeDrawer();return}
 if(e.target.closest("#drawerShade")){closeDrawer();return} if(e.target.closest("#copyCart")){copyCart();return} if(e.target.closest("#shareCart")){shareCart();return} if(e.target.closest("#exportCart")){exportCart();return} if(e.target.closest("#printCart")){printCart();return} if(e.target.closest("#clearCart")){cart={};saveCart();showToast("Panier vidé");return}
 const plus=e.target.closest("[data-cart-plus]"),minus=e.target.closest("[data-cart-minus]"),remove=e.target.closest("[data-cart-remove]");
 if(plus){cart[plus.dataset.cartPlus]=(cart[plus.dataset.cartPlus]||0)+1;saveCart();return}
 if(minus){const id=minus.dataset.cartMinus;cart[id]=Math.max(0,(cart[id]||0)-1);if(!cart[id])delete cart[id];saveCart();return}
 if(remove){delete cart[remove.dataset.cartRemove];saveCart();return}
 if(e.target.id==="overlay"&&currentRecipe)closeModal();
});
document.getElementById("q").addEventListener("input",render);document.getElementById("f").addEventListener("change",render);
document.addEventListener("submit",e=>{if(e.target.id==="authForm"){e.preventDefault();authSubmit(false)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(currentRecipe)closeModal();else closeDrawer()}});
async function load(){
 try{
  const bytes=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const txt=await new Response(stream).text();const data=JSON.parse(txt);R=data.recipes||[];
  // Photos culinaires propres, sans texte incrusté — sources Unsplash gratuites.
  const foodPhotos=[
   {match:/buffalo/i,url:"https://images.unsplash.com/photo-1608039829572-78524f79c4c7?auto=format&fit=crop&w=1200&q=85"},
   {match:/po[eê]l[eé]e m[eé]diterran[eé]enne/i,url:"https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=1200&q=85"},
   {match:/curry rouge tha[iï]/i,url:"https://images.unsplash.com/photo-1605461682195-9fd4d079a41d?auto=format&fit=crop&w=1200&q=85"},
   {match:/pa[eë]lla au poulet/i,url:"https://images.unsplash.com/photo-1714383611437-485d97141913?auto=format&fit=crop&w=1200&q=85"}
  ];
  R.forEach(recipe=>{const photo=foodPhotos.find(p=>p.match.test(recipe.title||""));if(photo)recipe.image_url=photo.url;});
  render();renderAuth();renderPlan();if(userSession)await loadPlan();
 }catch(err){console.error(err);document.getElementById("grid").innerHTML='<div class="error">Impossible de charger les recettes. Recharge la page.</div>'}
}
(async()=>{await refreshSession();await load();})();
</script>
